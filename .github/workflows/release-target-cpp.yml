name: "Release Target: C++ Universal Binary"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      COSMOCC_DIR: /tmp/cosmocc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosmocc
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/jart/cosmopolitan/releases/latest \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assets = [a['browser_download_url'] for a in data['assets'] if 'cosmocc' in a['name'] and a['name'].endswith('.zip')]
          print(assets[0])
          ")
          echo "cosmocc URL: $URL"
          mkdir -p "$COSMOCC_DIR" && cd "$COSMOCC_DIR"
          curl -fsSL "$URL" -o cosmocc.zip
          unzip -q cosmocc.zip
          COSMOCC_BIN=$(find "$COSMOCC_DIR" -name cosmoc++ -printf '%h\n' | head -1)
          if [ -z "$COSMOCC_BIN" ]; then
            echo "::error::cosmoc++ not found after extraction"
            exit 1
          fi
          echo "cosmocc bin: $COSMOCC_BIN"
          echo "$COSMOCC_BIN" >> "$GITHUB_PATH"

      - name: Build coglog-cli
        run: |
          cosmoc++ -std=c++17 -Os -mtiny \
            -o coglog-cli cpp/coglog/coglog-cli.cpp

      - name: Build coglog-mcp
        run: |
          cosmoc++ -std=c++17 -Os -mtiny \
            -o coglog-mcp cpp/coglog-mcp/coglog-mcp.cpp

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          DIRNAME="coglog-cpp-${VERSION}"
          mkdir -p "$DIRNAME"
          cp coglog-cli coglog-mcp "$DIRNAME/"
          cp cpp/coglog/README.md "$DIRNAME/README-cli.md"
          cp cpp/coglog-mcp/README.md "$DIRNAME/README-mcp.md"
          zip -r "coglog-cpp-${VERSION}.zip" "$DIRNAME/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-target-cpp
          path: "*.zip"
