name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  bash:
    uses: ./.github/workflows/release-target-bash.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  cpp:
    uses: ./.github/workflows/release-target-cpp.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  coglog-skill:
    uses: ./.github/workflows/release-target-coglog-skill.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  release:
    needs: [bash, cpp, coglog-skill]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*.zip
          generate_release_notes: true
