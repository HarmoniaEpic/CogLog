name: Release C++ Universal Binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get cosmocc latest release URL
        id: cosmocc
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/jart/cosmopolitan/releases/latest \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assets = [a['browser_download_url'] for a in data['assets'] if 'cosmocc' in a['name'] and a['name'].endswith('.zip')]
          print(assets[0])
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "cosmocc URL: $URL"

      - name: Install cosmocc
        run: |
          mkdir -p cosmocc
          curl -fsSL "${{ steps.cosmocc.outputs.url }}" -o cosmocc/cosmocc.zip
          cd cosmocc && unzip -q cosmocc.zip
          echo "$PWD/cosmocc/bin" >> "$GITHUB_PATH"

      - name: Build coglog-cli
        run: |
          cosmocc -std=c++17 -Os -mtiny -fno-exceptions -fno-rtti \
            -o coglog-cli cpp/coglog/coglog-cli.cpp

      - name: Build coglog-mcp
        run: |
          cosmocc -std=c++17 -Os -mtiny -fno-exceptions -fno-rtti \
            -o coglog-mcp cpp/coglog-mcp/coglog-mcp.cpp

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          DIRNAME="coglog-cpp-${VERSION}"
          mkdir -p "$DIRNAME"
          cp coglog-cli coglog-mcp "$DIRNAME/"
          cp README.md "$DIRNAME/"
          zip -r "coglog-cpp-${VERSION}.zip" "$DIRNAME/"
          echo "ASSET=coglog-cpp-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
