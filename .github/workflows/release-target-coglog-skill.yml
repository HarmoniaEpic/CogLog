name: "Release Target: coglog-skill"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"

          # coglog-skill: coglog-skill/coglog/ → zip 内に coglog-skill/coglog/ を保持
          mkdir -p _pkg/coglog-skill
          cp -r coglog-skill/coglog _pkg/coglog-skill/
          (cd _pkg && zip -r "../coglog-skill-${VERSION}.zip" coglog-skill/)

          # coglog-viz-skill: coglog-skill/coglog-viz/ → zip 内に coglog-viz-skill/coglog-viz/ を保持
          mkdir -p _pkg-viz/coglog-viz-skill
          cp -r coglog-skill/coglog-viz _pkg-viz/coglog-viz-skill/
          (cd _pkg-viz && zip -r "../coglog-viz-skill-${VERSION}.zip" coglog-viz-skill/)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-target-coglog-skill
          path: "*.zip"
