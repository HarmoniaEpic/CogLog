[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coglog-mcp"
version = "0.9.1"
description = "CogLog MCP server — a meta-cognition log for LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "HarmoniaEpic" }]
keywords = ["llm", "metacognition", "mcp", "mcp-server", "ai", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/HarmoniaEpic/coglog"
Source = "https://github.com/HarmoniaEpic/coglog/tree/main/python/coglog-mcp"

[project.scripts]
coglog-mcp = "coglog_mcp:main"
