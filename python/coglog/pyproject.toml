[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coglog"
version = "0.9.1"
description = "CogLog — a meta-cognition log for LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "HarmoniaEpic" }]
keywords = ["llm", "metacognition", "mcp", "ai", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/HarmoniaEpic/CogLog"
Source = "https://github.com/HarmoniaEpic/CogLog/tree/main/python/coglog"

[project.scripts]
coglog-cli = "coglog:main"

[tool.hatch.build]
exclude = [
    "*.bak",
    "*.swp",
    "*.swo",
    "*~",
    ".DS_Store",
]
